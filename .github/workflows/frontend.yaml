# ─────────────────────────────────────────────────────────────────────────────
# Frontend CI — Lint, format check, build, and unit tests
# Runs on pushes and PRs to main/dev, skipping backend-only changes
# ─────────────────────────────────────────────────────────────────────────────
name: Frontend Build

on:
  push:
    branches: [main, dev]
    paths-ignore: ['backend/**', 'pyproject.toml', 'uv.lock']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['backend/**', 'pyproject.toml', 'uv.lock']

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Format, i18n, and production build ────────────────────────────────────
  format-and-build:
    name: Format & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --force

      - name: Select changed frontend files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --name-only "${BASE_SHA}...HEAD" \
            | grep -E '\.(js|ts|svelte|css|md|html|json)$' \
            > "${RUNNER_TEMP}/changed-frontend-files" || true

      - name: Verify code formatting
        run: |
          if [ -s "${RUNNER_TEMP}/changed-frontend-files" ]; then
            xargs -d '\n' npx prettier --plugin-search-dir --check < "${RUNNER_TEMP}/changed-frontend-files"
          fi

      - name: Verify i18n strings
        run: node scripts/verify-i18n-keys.mjs "${RUNNER_TEMP}/changed-frontend-files"

      - name: Production build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  # ── Vitest unit tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies (frozen lockfile)
        run: npm ci --force

      - name: Execute test suite
        run: npm run test:frontend
