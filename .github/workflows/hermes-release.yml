name: Publish immutable Hermes images

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/hermes-release.yml'
      - 'backend/open_webui/integrations/hermes/**'
      - 'backend/open_webui/integrations/confluence/grounding_filter.py'
      - 'backend/open_webui/integrations/confluence/runtime.py'
      - 'backend/open_webui/integrations/confluence/scope_router.py'
      - 'backend/open_webui/main.py'
      - 'deploy/hermes/**'
      - 'src/lib/apis/memories/index.ts'
      - 'src/lib/components/chat/Settings/Personalization.svelte'
  workflow_dispatch:

concurrency:
  group: hermes-release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  HERMES_RELEASE: v2026.9.14
  HERMES_UPSTREAM_COMMIT: 345cd2b057a452236de401d3534b8502a7465e8d
  UPSTREAM_IMAGE: ghcr.io/mazazyrik/hermes-agent-upstream
  RUNTIME_IMAGE: ghcr.io/mazazyrik/awg-hermes-runtime

jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out AWG merge commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify AWG checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Check out pinned Hermes source
        uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: 345cd2b057a452236de401d3534b8502a7465e8d
          path: hermes-source
          persist-credentials: false

      - name: Verify pinned Hermes source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C hermes-source rev-parse HEAD)" = "$HERMES_UPSTREAM_COMMIT"
          test -z "$(git -C hermes-source status --porcelain)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing public packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for package in hermes-agent-upstream awg-hermes-runtime; do
            response="$RUNNER_TEMP/package-${package}.json"
            status=$(curl --silent --show-error --location \
              --output "$response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/users/mazazyrik/packages/container/${package}")
            case "$status" in
              200) test "$(jq -r '.visibility' "$response")" = 'private' ;;
              404) ;;
              *) echo "Package visibility check failed with HTTP $status" >&2; exit 1 ;;
            esac
          done

      - name: Build and publish immutable images
        working-directory: deploy/hermes
        shell: bash
        run: |
          set -euo pipefail
          ./build-release.sh \
            "$GITHUB_WORKSPACE/hermes-source" \
            "$UPSTREAM_IMAGE:$GITHUB_SHA" \
            "$RUNTIME_IMAGE:$GITHUB_SHA" \
            "$RUNNER_TEMP/hermes-release-manifest.json"

      - name: Verify manifest and runtime image
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/hermes-release-manifest.json"
          upstream_repository="${UPSTREAM_IMAGE}"
          runtime_repository="${RUNTIME_IMAGE}"

          jq -e \
            --arg release "$HERMES_RELEASE" \
            --arg commit "$HERMES_UPSTREAM_COMMIT" \
            --arg upstream "$upstream_repository" \
            --arg runtime "$runtime_repository" \
            '
              .hermes_release == $release and
              .hermes_upstream_commit == $commit and
              (.upstream_base_image | startswith($upstream + "@sha256:")) and
              (.runtime_image | startswith($runtime + "@sha256:")) and
              (.upstream_base_image | test("@sha256:[0-9a-f]{64}$")) and
              (.runtime_image | test("@sha256:[0-9a-f]{64}$")) and
              (.verified_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            ' "$manifest"

          upstream_image=$(jq -r '.upstream_base_image' "$manifest")
          runtime_image=$(jq -r '.runtime_image' "$manifest")
          docker pull "$runtime_image"
          docker image inspect "$runtime_image" >"$RUNNER_TEMP/runtime-image.json"
          jq -e \
            --arg release "$HERMES_RELEASE" \
            --arg commit "$HERMES_UPSTREAM_COMMIT" \
            --arg base "$upstream_image" \
            '
              .[0].Config.User == "10000:10000" and
              .[0].Config.Labels["org.opencontainers.image.version"] == $release and
              .[0].Config.Labels["org.opencontainers.image.revision"] == $commit and
              .[0].Config.Labels["com.awg.hermes.base-image"] == $base
            ' "$RUNNER_TEMP/runtime-image.json"

          for image in "$upstream_image" "$runtime_image"; do
            docker buildx imagetools inspect "$image" --format '{{json .Provenance}}' | jq -e 'type == "object" and length > 0'
            docker buildx imagetools inspect "$image" --format '{{json .SBOM}}' | jq -e 'type == "object" and length > 0'
          done

      - name: Verify package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api --jq '.visibility' /users/mazazyrik/packages/container/hermes-agent-upstream)" = 'private'
          test "$(gh api --jq '.visibility' /users/mazazyrik/packages/container/awg-hermes-runtime)" = 'private'

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@v4
        with:
          name: hermes-release-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/hermes-release-manifest.json
          if-no-files-found: error
          retention-days: 90
